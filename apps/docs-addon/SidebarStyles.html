<style>
  :root {
    --bg: #080C14;
    --bg-gradient: linear-gradient(135deg, #080C14 0%, #101726 100%);
    --accent: #C1121F;
    --accent-rgb: 193, 18, 31;
    --accent-hover: #9E0F19;
    --accent-glow: rgba(193, 18, 31, 0.35);
    
    --card-bg: rgba(20, 30, 50, 0.55);
    --card-border: rgba(255, 255, 255, 0.06);
    --card-hover-border: rgba(255, 255, 255, 0.11);
    
    --text: #F1F5F9;
    --text-muted: #94A3B8;
    --text-dark: #64748B;
    --border: rgba(255, 255, 255, 0.08);
    
    --input-bg: rgba(10, 15, 30, 0.5);
    --input-border: rgba(255, 255, 255, 0.08);
    --input-focus: var(--accent);
    
    --font-sans: 'Outfit', sans-serif;
    --font-sinhala: 'Noto Sans Sinhala', sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    background-image: var(--bg-gradient);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 0;
  }

  .sidebar-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }

  /* ── Header ── */
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: rgba(8, 12, 20, 0.85);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }

  .brand-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-logo {
    width: 26px;
    height: 26px;
    filter: drop-shadow(0 2px 6px var(--accent-glow));
  }

  .brand-info h1 {
    font-family: var(--font-sans);
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.1;
    background: linear-gradient(135deg, #FFFFFF 50%, #FFE3E5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .sub-brand {
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .api-status-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.03);
    padding: 3px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 0.7rem;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .status-dot.success { background-color: #10B981; box-shadow: 0 0 8px #10B981; }
  .status-dot.warning { background-color: #F59E0B; box-shadow: 0 0 8px #F59E0B; }
  .status-dot.error { background-color: #EF4444; box-shadow: 0 0 8px #EF4444; }

  .status-text {
    color: var(--text-muted);
  }

  /* ── Navigation Tabs ── */
  .sidebar-nav {
    display: flex;
    background: rgba(8, 12, 20, 0.3);
    border-bottom: 1px solid var(--border);
    padding: 2px;
  }

  .nav-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 8px 0;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    border-bottom: 2px solid transparent;
  }

  .nav-btn:hover {
    color: #FFFFFF;
  }

  .nav-btn.active {
    color: var(--accent);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── Panels ── */
  .sidebar-main {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
  }

  .sidebar-panel {
    display: none;
    animation: panelSlide 0.22s ease-out forwards;
  }

  .sidebar-panel.active {
    display: block;
  }

  @keyframes panelSlide {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h2 {
    font-family: var(--font-sinhala), var(--font-sans);
    font-size: 1.05rem;
    font-weight: 600;
    color: #FFFFFF;
    margin-bottom: 12px;
  }

  h3 {
    font-family: var(--font-sinhala), var(--font-sans);
    font-size: 0.85rem;
    font-weight: 500;
    color: #FFFFFF;
  }

  p {
    color: var(--text-muted);
    font-size: 0.78rem;
    line-height: 1.4;
  }

  /* ── Selection Tracker ── */
  .selection-tracker {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }

  .tracker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .tracker-title {
    font-family: var(--font-sinhala);
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .tracker-preview {
    font-family: var(--font-sinhala);
    font-size: 0.8rem;
    line-height: 1.4;
    color: #FFFFFF;
    max-height: 60px;
    overflow-y: auto;
    white-space: pre-wrap;
    padding-right: 4px;
  }

  .tracker-preview::-webkit-scrollbar {
    width: 2px;
  }
  .tracker-preview::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.08);
  }

  .tracker-preview.placeholder {
    color: var(--text-dark);
    font-style: italic;
  }

  .btn-icon {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: all 0.15s ease;
  }

  .btn-icon:hover {
    color: #FFFFFF;
    background: rgba(255, 255, 255, 0.06);
  }

  /* ── Form Inputs ── */
  .field-group {
    margin-bottom: 12px;
  }

  .field-label {
    display: block;
    font-family: var(--font-sinhala);
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 5px;
  }

  .sidebar-select {
    width: 100%;
    padding: 8px 10px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s ease;
  }

  .sidebar-select option {
    background: var(--bg);
    color: var(--text);
  }

  .sidebar-select:focus, .sidebar-input:focus {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }

  .sidebar-input {
    width: 100%;
    padding: 8px 10px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s ease;
  }

  /* ── Segmented Controls ── */
  .options-wrapper {
    margin-bottom: 12px;
  }

  .sub-option-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fadeIn 0.15s ease forwards;
  }

  .sub-label {
    font-family: var(--font-sinhala);
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .option-segmented {
    display: flex;
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px;
  }

  .seg-item {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sinhala), var(--font-sans);
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .seg-item:hover {
    color: #FFFFFF;
  }

  .seg-item.active {
    background: rgba(255, 255, 255, 0.06);
    color: #FFFFFF;
    font-weight: 500;
  }

  /* ── Buttons ── */
  .btn-primary {
    background: var(--accent);
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-family: var(--font-sinhala), var(--font-sans);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(193, 18, 31, 0.15);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 4px 10px rgba(193, 18, 31, 0.3);
  }

  .btn-primary:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: var(--font-sinhala), var(--font-sans);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .w-full {
    width: 100%;
  }

  /* Spinner Loader */
  .btn-primary.loading {
    color: transparent;
    position: relative;
    cursor: wait;
  }

  .btn-primary.loading::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    top: calc(50% - 7px);
    left: calc(50% - 7px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #FFFFFF;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── Result Box ── */
  .result-box {
    background: rgba(255, 255, 255, 0.015);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 14px;
    animation: fadeIn 0.2s ease forwards;
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    padding-bottom: 5px;
    margin-bottom: 6px;
  }

  .result-header h3 {
    font-family: var(--font-sinhala);
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .result-output {
    font-family: var(--font-sinhala);
    font-size: 0.85rem;
    line-height: 1.5;
    color: #FFFFFF;
    white-space: pre-wrap;
    max-height: 120px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .result-output::-webkit-scrollbar {
    width: 2px;
  }
  .result-output::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.08);
  }

  .result-insertion-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
    padding-top: 8px;
  }

  /* Grammar corrections details */
  .corrections-wrapper {
    margin-top: 8px;
    border-top: 1px dashed rgba(255, 255, 255, 0.05);
    padding-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .corr-card {
    background: rgba(239, 68, 68, 0.03);
    border-left: 2px solid #EF4444;
    border-radius: 4px;
    padding: 6px 8px;
  }

  .corr-comp {
    font-size: 0.78rem;
    margin-bottom: 2px;
  }

  .corr-del {
    color: #EF4444;
    text-decoration: line-through;
    font-family: var(--font-sinhala);
  }

  .corr-arrow {
    color: var(--text-dark);
    margin: 0 4px;
  }

  .corr-add {
    color: #10B981;
    font-weight: 500;
    font-family: var(--font-sinhala);
  }

  .corr-rule {
    font-family: var(--font-sinhala);
    color: var(--text-muted);
    font-size: 0.7rem;
    line-height: 1.2;
  }

  /* ── Settings styles ── */
  .settings-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .field-help {
    font-size: 0.68rem;
    color: var(--text-dark);
    margin-top: 3px;
  }

  /* ── Help Card ── */
  .help-card {
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 10px;
  }

  .help-card h3 {
    font-family: var(--font-sinhala);
    font-size: 0.8rem;
    margin-bottom: 6px;
    color: #FFFFFF;
  }

  .help-card ol {
    padding-left: 16px;
  }

  .help-card li {
    font-family: var(--font-sinhala);
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    line-height: 1.4;
  }

  /* Utility */
  .hidden {
    display: none !important;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
