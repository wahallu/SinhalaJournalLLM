  :root {
    /* Same brand ramp + ink neutrals as the web app and the extension. */
    --bg: #ffffff;
    --bg-gradient: linear-gradient(135deg, #ffffff 0%, #f8f7f7 100%);
    --accent: #cd191a;
    --accent-rgb: 205, 25, 26;
    --accent-hover: #ab1112;
    --accent-glow: rgba(205, 25, 26, 0.14);
    --accent-tint: #fdf3f2;
    --accent-tint-border: #f9cecd;

    --card-bg: #ffffff;
    --card-border: #f0efef;
    --card-hover-border: #e4e2e2;

    --text: #1d1819;
    --text-muted: #7b7676;
    --text-dark: #a6a2a2;

    --border: #f0efef;
    --input-bg: #ffffff;
    --input-border: #e4e2e2;
    --input-focus: var(--accent);

    --shadow: 0 4px 20px rgba(22, 17, 18, 0.08);
    --shadow-sm: 0 1px 4px rgba(22, 17, 18, 0.07);

    --font-sans: 'Satoshi', 'Noto Sans Sinhala', ui-sans-serif, system-ui, sans-serif;
    --font-display: 'Gwen', 'Satoshi', ui-sans-serif, sans-serif;
    --font-sinhala: 'Noto Sans Sinhala', sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    background-image: var(--bg-gradient);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  .sidebar-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }

  /* ── Header ── */
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .brand-area {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    filter: drop-shadow(0 1px 3px rgba(22, 17, 18, 0.16));
  }

  .brand-info h1 {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: var(--accent);
  }

  .sub-brand {
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .api-status-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #f8f7f7;
    padding: 3px 9px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 0.7rem;
    cursor: pointer;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .status-dot.success { background-color: #10B981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }
  .status-dot.warning { background-color: #F59E0B; box-shadow: 0 0 6px rgba(245, 158, 11, 0.5); }
  .status-dot.error { background-color: #EF4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }

  .status-text {
    color: var(--text-muted);
  }

  /* ── Signed-in strip ── */
  .account-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: var(--accent-tint);
    border-bottom: 1px solid var(--accent-tint-border);
    font-size: 0.75rem;
    cursor: pointer;
  }
  .account-avatar {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    color: #ffffff;
    font-size: 0.65rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .account-email {
    color: var(--accent-hover);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Navigation Tabs ── */
  .sidebar-nav {
    display: flex;
    background: #f8f7f7;
    border-bottom: 1px solid var(--border);
    padding: 2px;
  }

  .nav-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 0.72rem;
    font-weight: 500;
    padding: 8px 0;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    border-bottom: 2px solid transparent;
  }

  .nav-btn:hover {
    color: var(--text);
  }

  .nav-btn.active {
    color: var(--accent);
    font-weight: 700;
    border-bottom-color: var(--accent);
  }

  /* ── Panels ── */
  .sidebar-main {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
  }

  .sidebar-panel {
    display: none;
    animation: panelSlide 0.22s ease-out forwards;
  }

  .sidebar-panel.active {
    display: block;
  }

  @keyframes panelSlide {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h2 {
    font-family: var(--font-sans);
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
  }

  h3 {
    font-family: var(--font-sans);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
  }

  p {
    color: var(--text-muted);
    font-size: 0.78rem;
    line-height: 1.4;
  }

  /* ── Selection Tracker ── */
  .selection-tracker {
    background: #f8f7f7;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }

  .tracker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .tracker-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .tracker-preview {
    font-family: var(--font-sinhala), var(--font-sans);
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--text);
    max-height: 60px;
    overflow-y: auto;
    white-space: pre-wrap;
    padding-right: 4px;
  }

  .tracker-preview::-webkit-scrollbar { width: 3px; }
  .tracker-preview::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .tracker-preview.placeholder {
    color: var(--text-dark);
    font-style: italic;
  }

  .btn-icon {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    transition: all 0.15s ease;
  }

  .btn-icon:hover {
    color: var(--text);
    background: #f0efef;
  }

  /* ── Form Inputs ── */
  .field-group {
    margin-bottom: 12px;
  }

  .field-label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 5px;
  }

  .sidebar-select,
  .sidebar-input {
    width: 100%;
    padding: 8px 10px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .sidebar-input { cursor: text; }

  .sidebar-select option {
    background: var(--bg);
    color: var(--text);
  }

  .sidebar-select:focus,
  .sidebar-input:focus {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }

  /* ── Segmented Controls ── */
  .options-wrapper {
    margin-bottom: 12px;
  }

  .sub-option-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fadeIn 0.15s ease forwards;
  }

  .sub-label {
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .option-segmented {
    display: flex;
    flex-wrap: wrap;
    background: #f8f7f7;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 2px;
  }

  .seg-item {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 0.7rem;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .seg-item:hover {
    color: var(--text);
  }
