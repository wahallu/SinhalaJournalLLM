<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#9E0F19" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE3E5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <drop-shadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
      <drop-shadow dx="0" dy="2" stdDeviation="3" flood-color="#C1121F" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" />

  <!-- Glowing Sinhala 'Si' (සි) stylized symbol -->
  <g filter="url(#glow)">
    <!-- Path representing Sinhala 'Si' loop & flag -->
    <path d="M 42,72 
             C 42,55 58,45 74,48
             C 85,50 90,60 88,72
             C 86,84 76,88 64,88
             C 52,88 44,80 44,72
             C 44,66 50,60 58,62
             C 64,63 68,68 67,73
             C 66,78 62,81 58,80
             C 55,79 53,76 54,73" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- The Vowel Modifier (Is-pilla) for 'Si' -->
    <path d="M 74,47 
             C 74,32 58,26 48,34" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="7" 
          stroke-linecap="round" />
          
    <!-- Sparkle/AI node symbol -->
    <path d="M 88,38 L 91,42 L 95,43 L 91,44 L 90,48 L 87,44 L 83,43 L 87,42 Z" 
          fill="#FFFFFF" />
          
    <path d="M 98,54 L 99,56 L 101,57 L 99,58 L 98,60 L 97,58 L 95,57 L 97,56 Z" 
          fill="#FFE3E5" />
  </g>
</svg>
