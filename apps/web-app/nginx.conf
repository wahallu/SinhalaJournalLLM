server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location ~ ^/(admin|history|settings|profile|plans|login|signup|forgot-password|reset-password|verify-email)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
