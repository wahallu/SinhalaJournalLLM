server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──
    # The build writes .gz next to every compressible file at maximum level
    # (vite.config.js precompressPlugin); gzip_static serves those directly.
    # `gzip on` covers anything that was not precompressed.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml font/ttf;

    # ── Caching (browser and CDN) ──
    # /assets/* file names carry a content hash, so a file at a given URL can
    # never change: cache it for a year, and let a CDN keep it too.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fonts and images in public/ are not hashed; a day, then revalidate.
    location ~* \.(woff2|ttf|png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~ ^/(admin|history|settings|profile|plans|login|signup|forgot-password|reset-password|verify-email)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # HTML must always be revalidated: it names the current hashed bundles,
    # and a stale copy would point at assets a newer deploy removed.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
