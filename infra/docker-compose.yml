# Local development orchestration only.
#
# This is NOT the production deployment definition. Production deploys go
# through Coolify, one app at a time, each built from its own folder under
# apps/ (see infra/README.md) — that keeps apps independently deployable,
# which this file intentionally does not need to preserve for local dev.
#
# No local Postgres here — backend-api talks to Supabase over its HTTP API
# (PUBLIC_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY in apps/backend-api/.env),
# the same way in local dev and production. Point those at a dev/staging
# Supabase project, ideally, not the one production uses.
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up

services:
  backend-api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../apps/backend-api:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ../apps/backend-api/.env
    ports:
      - "8000:8000"
