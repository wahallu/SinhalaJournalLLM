# Load balancer for backend-api replicas.
#
# Used by infra/loadbalancer/docker-compose.yml. On Coolify, Traefik already
# balances across a resource's replicas; this file is for running several
# backend containers on a plain VM (or locally, to test multi-instance
# behaviour: caches, rate limits, the circuit breaker are all per-process).

upstream backend_api {
    # least_conn, not round-robin: a generation holds a connection for
    # seconds to minutes, so request counts say little about real load.
    least_conn;

    # Docker's DNS returns every replica of the `backend-api` service.
    # max_fails/fail_timeout take a dead replica out of rotation for 15s.
    server backend-api:8000 max_fails=3 fail_timeout=15s;

    # Reuse upstream connections instead of a TCP handshake per request.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the client address; with this LB as the only hop in front
        # of the API set TRUSTED_PROXY_COUNT=1, and add one per extra proxy
        # (e.g. a CDN) in front of it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SinLlama generations can run for minutes (SINLLAMA_TIMEOUT_SECONDS).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Retry a request on another replica only when the first could not
        # even be reached. Never on timeout: a POST that timed out may have
        # already run a generation, and retrying would run it twice.
        proxy_next_upstream error;
        proxy_next_upstream_tries 2;

        # The NDJSON streams (Optimize, image generation) must not be
        # buffered; the backend also sends X-Accel-Buffering: no.
        proxy_buffering off;
    }

    # Readiness for an outer orchestrator. The per-replica checks are in
    # docker-compose.yml.
    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }
}
