# N backend-api replicas behind an nginx load balancer.
#
#   docker compose -f infra/loadbalancer/docker-compose.yml up --build --scale backend-api=3
#
# The API is then on http://localhost:8080. Replicas are not published on
# the host; only the balancer is.

services:
  backend-api:
    build: ../../apps/backend-api
    env_file:
      - ../../apps/backend-api/.env
    environment:
      - WEB_CONCURRENCY=2
      - TRUSTED_PROXY_COUNT=1
    expose:
      - "8000"
    healthcheck:
      # /health/ready checks the database; a replica that cannot reach it is
      # marked unhealthy instead of serving 401s to everyone it gets.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  loadbalancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend-api
    restart: unless-stopped
